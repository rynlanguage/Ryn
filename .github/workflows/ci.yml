name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    env:
      RUST_MIN_STACK: 16777216
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Build documentation
        run: cargo doc --workspace --no-deps

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run release tests
        run: cargo test --release --workspace -- --test-threads=4

      - name: Run tests
        run: cargo test --workspace

  native:
    name: Native compiler on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the release compiler
        run: cargo build --release --locked

      - name: Bootstrap the native compiler to a byte-identical fixpoint
        run: ./target/release/ryn bootstrap --native

      - name: Run the native suite, runtime leak and backend tests
        run: cargo test --release --test suite --test native_hello --test native_runtime_leaks --test backend_selection
