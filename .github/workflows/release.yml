name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and update
        required: true
        type: string

permissions:
  contents: write

# The archives are built with the native compiler from the committed seed; no Rust, Cargo, C compiler or linker is used.
# The Windows archive is cross-compiled on Linux.
jobs:
  release:
    name: Linux and Windows archives
    runs-on: ubuntu-latest
    steps:
      - name: Select release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$PUSH_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Verify the seed checksum
        run: cd bootstrap && sha256sum --check rync-seed.sha256

      - name: Bootstrap the compiler to a byte-identical fixpoint
        run: env -i PATH=/usr/bin:/bin HOME="$HOME" tools/bootstrap-native.sh "$PWD/bootstrap/rync-seed" "$RUNNER_TEMP/fixpoint"

      - name: The committed seed is the fixpoint of this source
        run: cmp bootstrap/rync-seed "$RUNNER_TEMP/fixpoint/rync-stage2"

      - name: Run the language suite
        run: |
          env -i PATH=/usr/bin:/bin HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            python3 tools/test-native-sources.py "$RUNNER_TEMP/fixpoint/rync-stage2" $(python3 tools/list-suite.py) tests/native/*.ryn

      - name: Build the archives
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: python3 tools/make-dist.py "$RUNNER_TEMP/fixpoint/rync-stage2" "${TAG#v}" "$PWD/dist"

      - name: Smoke check the Linux archive
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="${TAG#v}"
          tar -xzf "dist/ryn-${version}-linux-x86_64.tar.gz" -C "$RUNNER_TEMP"
          ryn="$RUNNER_TEMP/ryn-${version}-linux-x86_64/ryn"
          [[ "$("$ryn" --version)" == "ryn $version" ]]
          output="$("$ryn" run examples/arguments.ryn -- "linux smoke")"
          printf '%s\n' "$output"
          grep -Fxq 'argument count: 1' <<< "$output"
          grep -Fxq 'first argument: linux smoke' <<< "$output"

      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="${TAG#v}"
          gh release upload "$TAG" \
            "dist/ryn-${version}-linux-x86_64.tar.gz" "dist/ryn-${version}-linux-x86_64.tar.gz.sha256" \
            "dist/ryn-${version}-windows-x86_64.zip" "dist/ryn-${version}-windows-x86_64.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
