name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and update
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Select release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$PUSH_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux binary
        run: cargo build --release --locked

      - name: Smoke check
        shell: bash
        run: |
          ./target/release/ryn --version
          output="$(./target/release/ryn run examples/arguments.ryn -- "linux smoke")"
          printf '%s\n' "$output"
          grep -Fxq 'argument count: 1' <<< "$output"
          grep -Fxq 'first argument: linux smoke' <<< "$output"

      - name: Bootstrap native compiler under 1 GiB
        shell: bash
        run: |
          mkdir -p native-bootstrap/dump
          ./target/release/ryn build selfhost/src/native.ryn -o native-bootstrap/native
          RYN_DUMP_SEMA="$PWD/native-bootstrap/dump" ./target/release/ryn check selfhost/src/rync.ryn
          native-bootstrap/native native-bootstrap/dump/ryn.ir exe > native-bootstrap/seed
          chmod +x native-bootstrap/seed
          tools/bootstrap-native.sh "$PWD/native-bootstrap/seed" "$PWD/native-bootstrap/fixpoint"
          python3 tools/test-native-sources.py "$PWD/native-bootstrap/fixpoint/rync-stage2" tests/native/freestanding_float_rounding.ryn tests/native/freestanding_math.ryn tests/native/nested_result_ownership.ryn

      - name: Package and upload Linux binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="${TAG#v}"
          stage="ryn-${version}-linux-x86_64"
          mkdir "$stage"
          cp target/release/ryn README.md "$stage/"
          tar -czf "${stage}.tar.gz" "$stage"
          sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256"
          gh release upload "$TAG" "${stage}.tar.gz" "${stage}.tar.gz.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          native_stage="rync-${version}-linux-x86_64"
          mkdir -p "$native_stage/tools" "$native_stage/docs" "$native_stage/selfhost" "$native_stage/stdlib/std"
          cp native-bootstrap/fixpoint/rync-stage2 "$native_stage/rync"
          cp docs/native-compiler.md "$native_stage/README.md"
          cp tools/bootstrap-native.sh "$native_stage/tools/"
          cp -R selfhost/src "$native_stage/selfhost/"
          cp -R stdlib/std/src "$native_stage/stdlib/std/"
          cp docs/native-compiler.md docs/native-ownership-validation.md docs/native-float-validation.md "$native_stage/docs/"
          tar -czf "${native_stage}.tar.gz" "$native_stage"
          sha256sum "${native_stage}.tar.gz" > "${native_stage}.tar.gz.sha256"
          gh release upload "$TAG" "${native_stage}.tar.gz" "${native_stage}.tar.gz.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  windows-x86_64:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - name: Select release tag
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $tag = $env:INPUT_TAG
          } else {
            $tag = $env:PUSH_TAG
          }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid release tag: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows binary
        run: cargo build --release --locked

      - name: Smoke check
        shell: pwsh
        run: |
          $version = & target/release/ryn.exe --version
          if ($LASTEXITCODE -ne 0) { throw "ryn --version failed with exit code $LASTEXITCODE" }
          Write-Output $version
          $expectedVersion = "ryn $($env:TAG.Substring(1))"
          if ($version.Trim() -ne $expectedVersion) { throw "Unexpected version: $version" }
          $output = & target/release/ryn.exe run examples/arguments.ryn -- "windows smoke"
          if ($LASTEXITCODE -ne 0) { throw "Ryn smoke program failed with exit code $LASTEXITCODE" }
          $output | ForEach-Object { Write-Output $_ }
          if ($output -notcontains 'argument count: 1') { throw 'Argument count smoke check failed' }
          if ($output -notcontains 'first argument: windows smoke') { throw 'Argument value smoke check failed' }
        env:
          TAG: ${{ steps.release.outputs.tag }}

      - name: Package and upload Windows binary
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          $version = $env:TAG.Substring(1)
          $stage = "ryn-$version-windows-x86_64"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item target/release/ryn.exe, README.md, install.ps1 -Destination $stage
          $archive = "$stage.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -LiteralPath "$archive.sha256" -NoNewline
          gh release upload $env:TAG $archive "$archive.sha256" --repo $env:GITHUB_REPOSITORY --clobber
